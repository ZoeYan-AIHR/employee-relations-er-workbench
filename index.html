function zipStore(files){let local=[],central=[],offset=0;for(const f of files){const name=enc.encode(f.name),body=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(body);const header=join([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(body.length),u32(body.length),u16(name.length),u16(0),name]);local.push(header,body);const cd=join([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(body.length),u32(body.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);central.push(cd);offset+=header.length+body.length}const c=join(central),end=join([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(c.length),u32(offset),u16(0)]);return join([...local,c,end])}

function cellColumn(ref){const m=(ref||'').match(/[A-Z]+/);if(!m)return 0;return m[0].split('').reduce((n,c)=>n*26+c.charCodeAt(0)-64,0)-1}
function xmlDoc(bytes){return new DOMParser().parseFromString(dec.decode(bytes),'application/xml')}
async function parseXlsx(file){const zip=await unzip(new Uint8Array(await file.arrayBuffer()));const ss=zip['xl/sharedStrings.xml']?Array.from(xmlDoc(zip['xl/sharedStrings.xml']).getElementsByTagName('si')).map(x=>Array.from(x.getElementsByTagName('t')).map(t=>t.textContent).join('')):[];const source=zip['xl/worksheets/sheet1.xml'];if(!source)throw new Error('未找到第一个工作表，请使用系统提供的导入模板。');const doc=xmlDoc(source);if(doc.getElementsByTagName('parsererror').length)throw new Error('Excel 工作表内容无法读取。');const rows=[];for(const r of Array.from(doc.getElementsByTagName('row'))){const row=[];for(const c of Array.from(r.getElementsByTagName('c'))){const ci=cellColumn(c.getAttribute('r'));const type=c.getAttribute('t');let val='';if(type==='inlineStr')val=Array.from(c.getElementsByTagName('t')).map(t=>t.textContent).join('');else{const v=c.getElementsByTagName('v')[0]?.textContent||'';val=type==='s'?(ss[Number(v)]||''):v}row[ci]=val}rows.push(row)}return rows}
function csvRows(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"')quoted=!quoted;else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}
function openImport(){modal(`<div class="modalhead"><h2>导入 Excel 事项</h2><button onclick="closeModal()">×</button></div><div class="modalbody"><p>请优先使用“下载导入模板”。导入过程完全在当前浏览器内完成，不上传文件。要求至少含“员工姓名”“事项类型”两列。</p><div class="drag"><div class="big">⇧</div><b>选择 .xlsx 或 .csv 文件</b><span>建议使用 Chrome / Edge；单次建议不超过 5MB。</span><input id="import-file" type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><div style="margin-top:14px"><button class="btn primary" onclick="importFile()">开始导入</button></div></div></div>`)}
async function importFile(){const f=$('#import-file')?.files?.[0];if(!f){toast('请先选择文件。');return}if(f.size>5*1024*1024){toast('文件超过 5MB 建议限制。');return}try{const rows=f.name.toLowerCase().endsWith('.csv')?csvRows(await f.text()):await parseXlsx(f);if(!rows.length)throw new Error('文件中没有可导入的数据。');const header=rows[0].map(x=>String(x||'').trim());const index=Object.fromEntries(header.map((x,i)=>[x,i]));if(index['员工姓名']===undefined||index['事项类型']===undefined)throw new Error('缺少必填列：员工姓名、事项类型。');let created=0,updated=0,skipped=0,errors=[];for(let ri=1;ri<rows.length;ri++){const row=rows[ri];const get=n=>String(row[index[n]]??'').trim();const id=get('事项编号'),name=get('员工姓名'),type=get('事项类型');if(!name||!type||id.includes('示例')){if(name||type)skipped++;continue}if(!TYPES.includes(type)){skipped++;errors.push(`第 ${ri+1} 行：事项类型无效`);continue}const field={id,employeeName:name,type,status:STATUSES.includes(get('状态'))?get('状态'):'待研判',ownerName:get('责任人')||'ZOE',ownerRole:ROLES.includes(get('责任人角色'))?get('责任人角色'):'HRBP',department:get('涉及部门'),businessOwner:get('业务负责人')||'待指定',risk:['低','中','高'].includes(get('风险等级'))?get('风险等级'):'中',stage:get('当前阶段')||'事实澄清',dueDate:/^\d{4}-\d{2}-\d{2}$/.test(get('关键日期'))?get('关键日期'):addDays(7),summary:get('说明')};let old=id&&state.data.cases.find(x=>x.id===id);if(old){const sameType=old.type===type;const fresh=buildCase({...field,id:old.id,createdAt:old.createdAt,planChoice:sameType?old.planChoice:'',tasks:sameType?old.tasks:undefined,docs:sameType?old.docs:undefined});state.data.cases=state.data.cases.map(x=>x.id===id?fresh:x);updated++}else{state.data.cases.unshift(buildCase(field));created++}}save();closeModal();render();toast(`导入完成：新增 ${created}，更新 ${updated}${skipped?`，跳过 ${skipped}`:''}`);if(errors.length)console.warn('导入明细',errors)}catch(e){toast(e.message||'导入失败。')}}
function backupJSON(){download(new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),`员工关系工作台备份_${shanghaiParts().isoDate.replaceAll('-','')}.json`)}
function restoreJSON(){modal(`<div class="modalhead"><h2>恢复 JSON 备份</h2><button onclick="closeModal()">×</button></div><div class="modalbody"><p>恢复会覆盖当前浏览器中的员工关系事项数据。建议先导出一份 JSON 备份。</p><input id="restore-file" type="file" accept=".json,application/json"><div class="buttons" style="justify-content:flex-end;margin-top:18px"><button class="btn primary" onclick="applyRestore()">恢复数据</button></div></div>`)}
async function applyRestore(){const f=$('#restore-file')?.files?.[0];if(!f){toast('请选择 JSON 备份文件。');return}try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.cases))throw new Error('不是有效的工作台备份文件。');state.data=d;state.selectedId=d.cases[0]?.id||'';save();closeModal();go('dashboard');toast('已恢复本地备份。')}catch(e){toast(e.message||'恢复失败。')}}
function resetDemo(){if(!confirm('确定恢复示例数据吗？当前浏览器已保存的数据将被覆盖。'))return;state.data={version:2,profile:{name:'ZOE',role:'HRBP'},cases:seed()};state.selectedId=state.data.cases[0].id;save();go('dashboard');toast('已恢复示例数据。')}
function init(){state.data=load();state.selectedId=state.data.cases[0]?.id||'';state.caseMenuOpen=false;render();setInterval(updateClock,1000)}
init();
</script>
